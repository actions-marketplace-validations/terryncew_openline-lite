name: Release Impact Ruff Exact Autofix

on:
  push:
    branches:
      - release/openline-lite-v0.6.0
    paths:
      - ".github/workflows/release-impact-ruff-autofix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/openline-lite-v0.6.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact canonical formatter
        run: |
          python -m pip install ruff==0.15.2
          ruff --version

      - name: Format release example exactly
        run: |
          ruff format examples/impact.py
          ruff format --check examples/impact.py
          ruff check examples/impact.py

      - name: Commit exact formatted bytes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add examples/impact.py
          git rm .github/workflows/release-impact-ruff-autofix.yml

          git commit -m "fix(release): apply canonical Ruff formatting"
          git push origin HEAD:release/openline-lite-v0.6.0
