name: OpenLine Check Selective Reverification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selective-reverification:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run selective reverification tests
        run: python -m unittest tests/test_selective_reverification.py -v
