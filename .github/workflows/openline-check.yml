name: openline-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest tests.test_check -v
      - run: >-
          openline-check examples/openline-check/check.json
          --output-dir /tmp/openline-check
          --now 2026-08-21T18:00:00Z
      - run: test -s /tmp/openline-check/proof.md
      - run: test -s /tmp/openline-check/result.json
      - run: test -s /tmp/openline-check/decision.receipt.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/openline-check-wheel
      - run: /tmp/openline-check-wheel/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/openline-check-wheel/bin/openline-check --help
