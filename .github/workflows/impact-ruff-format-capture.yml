name: Impact Ruff Exact Autofix

on:
  push:
    branches:
      - feat/trust-boundary-index
    paths:
      - ".github/workflows/impact-ruff-format-capture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trust-boundary-index
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact canonical formatter
        run: |
          python -m pip install ruff==0.15.2
          ruff --version

      - name: Apply exact canonical formatting
        run: |
          ruff format openline_lite/impact.py tests/test_impact.py
          ruff format --check openline_lite/impact.py tests/test_impact.py
          ruff check openline_lite/impact.py tests/test_impact.py

      - name: Commit exact formatted bytes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add openline_lite/impact.py tests/test_impact.py
          git rm .github/workflows/impact-ruff-format-capture.yml

          if git diff --cached --quiet; then
            echo "No formatter changes were necessary."
            exit 0
          fi

          git commit -m "fix(lite): apply canonical Ruff formatting"
          git push origin HEAD:feat/trust-boundary-index
